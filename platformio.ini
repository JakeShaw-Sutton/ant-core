; Ant Core - shared XIAO ESP32-S3 Sense / ESP32-C3 firmware

[platformio]
default_envs = seeed_xiao_esp32s3

[antcore]
platform = espressif32@6.13.0
framework = arduino

board_build.filesystem = littlefs
build_src_filter =
  +<*>
  -<boot_probe.cpp>

lib_deps =
  tbekas/BLE-Gamepad-Client @ 0.12.1
  madhephaestus/ESP32Servo @ 3.2.0
  bblanchon/ArduinoJson @ 6.21.5
  esphome/ESPAsyncWebServer-esphome @ 3.3.0
  sparkfun/SparkFun BMI270 Arduino Library @ 1.0.3

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -D CONFIG_BT_BLEGC_DEVICE_NAME=\"AntCore\"
  -D CONFIG_BT_NIMBLE_USE_ESP_TIMER=0

monitor_speed = 115200
monitor_echo = true
upload_speed = 460800

[env:seeed_xiao_esp32s3]
extends = antcore
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv

[env:seeed_xiao_esp32c3]
extends = antcore
board = seeed_xiao_esp32c3
board_build.partitions = partitions_c3.csv
extra_scripts = pre:tools/pio_ble_task_stack.py
; Ant Core uses one Xbox client. Leave RAM for Wi-Fi and dashboard responses.
build_flags =
  ${antcore.build_flags}
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
  -D WS_MAX_QUEUED_MESSAGES=4
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D ANTCORE_BLE_TASK_STACK_SIZE=4096

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  +<antcore_logic.cpp>
  +<antcore_controls.cpp>
  +<antcore_output_test.cpp>
  +<antcore_safety.cpp>
  +<antcore_control_owner.cpp>

[env:boot_probe]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv
build_src_filter =
  -<*>
  +<boot_probe.cpp>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -D ANTCORE_BOOT_PROBE
monitor_speed = 115200
monitor_echo = true
upload_speed = 460800
